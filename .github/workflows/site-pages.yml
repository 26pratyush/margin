name: Publish product site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'site/public/screenshots/**'
      - 'docs/DESIGN_SYSTEM.md'
      - 'docs/DEPLOYMENT.md'
      - '.github/workflows/site-pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'site/public/screenshots/**'
      - 'docs/DESIGN_SYSTEM.md'
      - 'docs/DEPLOYMENT.md'
      - '.github/workflows/site-pages.yml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify product site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install locked site dependencies
        run: npm ci

      - name: Check site formatting
        run: npm run format:check

      - name: Type-check site
        run: npm run check

      - name: Test site interactions
        run: npm test

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy product site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Local app check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify local app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint source
        run: npm run lint

      - name: Run tests with coverage thresholds
        run: npm run test:coverage

      - name: Type-check
        run: npm run check

      - name: Build static app
        run: npm run build

      - name: Seed synthetic demo data
        run: npm run demo:seed

      - name: Verify synthetic demo data
        run: npm run demo:status

      - name: Reset synthetic demo data
        run: npm run demo:reset

      - name: Confirm synthetic demo data is reset
        run: npm run demo:status
